services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ecommarce
      POSTGRES_PASSWORD: ecommarce
      POSTGRES_DB: ecommarce
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    volumes: ["redisdata:/data"]
  mailhog:
    image: mailhog/mailhog:latest
    ports: ["1025:1025", "8025:8025"]
volumes:
  pgdata:
  redisdata:
