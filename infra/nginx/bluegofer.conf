server {
    server_name nolimitshopping.com www.nolimitshopping.com;

    # API proxy (backend) - added 2026-09-29
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/nolimitshopping.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/nolimitshopping.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}
server {
    server_name api.nolimitshopping.com;
    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/nolimitshopping.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/nolimitshopping.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    server_name admin.nolimitshopping.com;
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/nolimitshopping.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/nolimitshopping.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = www.nolimitshopping.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = nolimitshopping.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name nolimitshopping.com www.nolimitshopping.com;
    return 404; # managed by Certbot




}
server {
    if ($host = api.nolimitshopping.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name api.nolimitshopping.com;
    return 404; # managed by Certbot


}
server {
    if ($host = admin.nolimitshopping.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name admin.nolimitshopping.com;
    return 404; # managed by Certbot


}
